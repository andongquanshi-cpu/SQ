&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

e .tj-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}#tj-prototype #tj-expense-form{padding-bottom:15px;border-bottom:1px solid var(--tj-line)}#tj-prototype .tj-toast{background:var(--tj-wash);border-top:1px solid var(--tj-line);font-size:12px;line-height:1.8;padding:11px 20px;text-align:center}#tj-prototype .tj-entry-end{font-size:11px;color:var(--tj-muted);text-align:center;margin:14px 0 2px}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;tj-prototype&#x27;);
  const $ = (s) =&gt; root.querySelector(s);
  const $$ = (s) =&gt; [...root.querySelectorAll(s)];
  const city = $(&#x27;#tj-city-photo&#x27;).content.textContent.trim();
  const snow = $(&#x27;#tj-snow-photo&#x27;).content.textContent.trim();
  const money = v =&gt; &#x27;¥&#x27; + (v / 100).toLocaleString(&#x27;zh-CN&#x27;, {minimumFractionDigits:2, maximumFractionDigits:2});
  const escape = text =&gt; String(text).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
  const defaults = {screen:&#x27;home&#x27;,day:3,layout:&#x27;postcard&#x27;,photo:&#x27;snow&#x27;,title:&#x27;在雪里走得很慢&#x27;,text:&#x27;没有赶路，也没有目的。只是和你一起，把冬天走成了回忆。&#x27;,ticket:true,sticker:&#x27;出走日&#x27;,showAA:false};
  let state = {...defaults};
  let entries = [{title:&#x27;把城市的黄昏装进口袋&#x27;,text:&#x27;拐进一条没做攻略的小路，发现了一家很喜欢的小店。\n今天最好的安排，是没有把行程排满。&#x27;,author:&#x27;同伴&#x27;,day:&#x27;第 2 天&#x27;,layout:&#x27;ticket&#x27;,photo:&#x27;city&#x27;,ticket:true,sticker:&#x27;好天气&#x27;}];
  let expenses = [{title:&#x27;两晚住宿&#x27;,cents:50000,payer:&#x27;me&#x27;,split:&#x27;equal&#x27;},{title:&#x27;一起吃饭&#x27;,cents:30000,payer:&#x27;partner&#x27;,split:&#x27;equal&#x27;},{title:&#x27;同伴的纪念品&#x27;,cents:10000,payer:&#x27;partner&#x27;,split:&#x27;partner&#x27;}];
  const plans = {1:[[&#x27;抵达&#x27;,&#x27;去住处放下行李&#x27;,&#x27;不接长途，先安顿下来&#x27;],[&#x27;晚上&#x27;,&#x27;附近吃一顿晚饭&#x27;,&#x27;边吃边商量明天的安排&#x27;]],2:[[&#x27;10:00&#x27;,&#x27;逛街，寻找小店&#x27;,&#x27;留一点没有计划的时间&#x27;],[&#x27;16:30&#x27;,&#x27;在城市里等黄昏&#x27;,&#x27;遇到喜欢的风景就停下来&#x27;]],3:[[&#x27;09:00&#x27;,&#x27;一起吃早餐&#x27;,&#x27;出发前确认当天的天气&#x27;],[&#x27;14:00&#x27;,&#x27;午后沿着小街慢慢走&#x27;,&#x27;车站附近集合，轻装出发&#x27;],[&#x27;18:00&#x27;,&#x27;找一家热乎的小店&#x27;,&#x27;顺便把今天的照片收进手账&#x27;]]};
  const done = new Set();
  function save(){
    const summary={style:&#x27;固定模板拼贴手账&#x27;,screen:state.screen,template:state.layout,sticker:state.sticker,hasTicket:state.ticket};
    const privateContent={...state,entries:entries.slice(0,8),expenses:expenses.slice(0,15),done:[...done]};
    if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:summary,privateContent}).catch(()=&gt;{});
  }
  function restore(saved){
    const p = saved?.privateContent;
    if(!p || typeof p !== &#x27;object&#x27;) return;
    for(const key of Object.keys(defaults)) if(typeof p[key]===typeof defaults[key]) state[key]=p[key];
    if(![&#x27;home&#x27;,&#x27;itinerary&#x27;,&#x27;journal&#x27;,&#x27;editor&#x27;,&#x27;ledger&#x27;].includes(state.screen)) state.screen=&#x27;home&#x27;;
    if(![&#x27;postcard&#x27;,&#x27;ticket&#x27;,&#x27;double&#x27;].includes(state.layout)) state.layout=&#x27;postcard&#x27;;
    if(![1,2,3].includes(state.day)) state.day=3;
    if(Array.isArray(p.entries)) entries=p.entries.filter(e=&gt;e &amp;&amp; typeof e.title===&#x27;string&#x27; &amp;&amp; typeof e.text===&#x27;string&#x27;).slice(0,8);
    if(Array.isArray(p.expenses)) expenses=p.expenses.filter(e=&gt;e &amp;&amp; Number.isInteger(e.cents) &amp;&amp; e.cents&gt;0 &amp;&amp; [&#x27;me&#x27;,&#x27;partner&#x27;].includes(e.payer) &amp;&amp; [&#x27;equal&#x27;,&#x27;me&#x27;,&#x27;partner&#x27;].includes(e.split)).slice(0,15);
    done.clear(); if(Array.isArray(p.done)) p.done.forEach(k=&gt;done.add(k));
  }
  function icons(){if(window.lucide) window.lucide.createIcons({attrs:{width:18,height:18}});}
  function page(e){
    const main = e.photo===&#x27;city&#x27; ? city : snow;
    const other = e.photo===&#x27;city&#x27; ? snow : city;
    const photos=e.layout===&#x27;double&#x27;?`&lt;div class=&quot;tj-double-photos&quot;&gt;&lt;img src=&quot;${main}&quot; alt=&quot;旅行照片示例&quot;&gt;&lt;img src=&quot;${other}&quot; alt=&quot;另一张旅行照片示例&quot;&gt;&lt;/div&gt;`:`&lt;img src=&quot;${main}&quot; alt=&quot;旅行照片示例&quot;&gt;`;
    const day=String(e.day || &#x27;3&#x27;).match(/\d+/)?.[0] || &#x27;3&#x27;;
    const ticket=e.ticket?`&lt;div class=&quot;tj-scrap-ticket&quot;&gt;&lt;span&gt;一起出发&lt;br&gt;OUR LITTLE JOURNEY&lt;/span&gt;&lt;b&gt;DAY ${day.padStart(2,&#x27;0&#x27;)}&lt;/b&gt;&lt;span&gt;两位同行&lt;br&gt;纪念票根&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;;
    return `&lt;article class=&quot;tj-paper-page&quot; data-layout=&quot;${escape(e.layout)}&quot;&gt;${photos}${e.sticker!==&#x27;不加贴纸&#x27;?`&lt;span class=&quot;tj-stamp&quot;&gt;${escape(e.sticker)}&lt;/span&gt;`:&#x27;&#x27;}&lt;h2&gt;${escape(e.title||&#x27;今天的小事&#x27;)}&lt;/h2&gt;&lt;p&gt;${escape(e.text)}&lt;/p&gt;${ticket}&lt;/article&gt;`;
  }
  function renderEditor(){
    $(&#x27;.tj-edit-preview&#x27;).innerHTML=page(state);
    $$(&#x27;[data-template]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.template===state.layout)));
    $$(&#x27;[data-sticker]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.sticker===state.sticker)));
  }
  function renderJournal(){
    $(&#x27;.tj-journal-feed&#x27;).innerHTML=entries.map(e=&gt;`&lt;div class=&quot;tj-entry-meta&quot;&gt;&lt;span&gt;${escape(e.day)} · ${escape(e.author)}的一页&lt;/span&gt;&lt;span&gt;共同可见 · 示例&lt;/span&gt;&lt;/div&gt;${page(e)}`).join(&#x27;&#x27;)+&#x27;&lt;p class=&quot;tj-entry-end&quot;&gt;不同的人，留下同一段旅程。&lt;/p&gt;&#x27;;
  }
  function renderPlan(){
    $$(&#x27;[data-day]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(Number(b.dataset.day)===state.day)));
    $(&#x27;.tj-day-content&#x27;).innerHTML=plans[state.day].map((p,i)=&gt;{const key=state.day+&#x27;-&#x27;+i;return `&lt;div class=&quot;tj-plan-row ${done.has(key)?&#x27;is-done&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;tj-plan-time&quot;&gt;${p[0]}&lt;/span&gt;&lt;div&gt;&lt;b&gt;${p[1]}&lt;/b&gt;&lt;p&gt;${p[2]}&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;tj-plan-check-label&quot;&gt;&lt;input class=&quot;tj-plan-check&quot; type=&quot;checkbox&quot; data-task=&quot;${key}&quot; ${done.has(key)?&#x27;checked&#x27;:&#x27;&#x27;} aria-label=&quot;标记${p[1]}已完成&quot;&gt;&lt;/label&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;);
    $$(&#x27;[data-task]&#x27;).forEach(c=&gt;c.addEventListener(&#x27;change&#x27;,()=&gt;{if(c.checked)done.add(c.dataset.task);else done.delete(c.dataset.task);renderPlan();save();}));
  }
  function renderLedger(){
    const total=expenses.reduce((a,e)=&gt;a+e.cents,0); let paidMe=0,owedMe=0,paidPartner=0,owedPartner=0;
    expenses.forEach(e=&gt;{let myShare=e.split===&#x27;me&#x27;?e.cents:e.split===&#x27;partner&#x27;?0:Math.floor(e.cents/2)+(e.cents%2 &amp;&amp; e.payer===&#x27;me&#x27;?1:0); if(e.payer===&#x27;me&#x27;)paidMe+=e.cents;else paidPartner+=e.cents;owedMe+=myShare;owedPartner+=e.cents-myShare;});
